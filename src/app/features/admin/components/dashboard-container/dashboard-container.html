<app-dashboard-aside
  [isSidebarOpen]="isSidebarOpen()"
  [isSidebarCollapsed]="isSidebarCollapsed()"
  [navItems]="navItems"
  [bottomNavItems]="bottomNavItems"
  logoIcon="fa-solid fa-language"
  badgeLabel="École"
  roleLabel="Directeur"
  accentBg="bg-blue-50"
  accentText="text-blue-600"
  gradientFrom="from-blue-600"
  gradientTo="to-sky-500"
  [fullName]="fullName()"
  [initials]="initials()"
  [profileImage]="user()?.profile"
  (closeSidebar)="closeSidebar()"
  (toggleCollapse)="toggleCollapse()"
  (logout)="logout()"
/>

<!-- Main content -->
<section
  class="flex min-h-screen min-w-0 flex-col bg-gray-50 transition-all duration-300"
  [class.lg:ml-72]="!isSidebarCollapsed()"
  [class.lg:ml-[72px]]="isSidebarCollapsed()"
>
  <!-- Header -->
  <app-dashboard-header
    title="Tableau de Bord"
    subtitle="Espace Directeur"
    [fullName]="fullName()"
    [initials]="initials()"
    [profileImage]="user()?.profile"
    [showingAlerts]="true"
    [alertsCount]="incompleteCount()"
    alertsRoute="/schoolAdmin/alerts"
    (toggleSidebar)="toggleSidebar()"
  />

  <!-- Page content -->
  <main class="mx-auto w-full max-w-[1400px] flex-1 p-4 md:p-8">
    <router-outlet />
  </main>
</section>
