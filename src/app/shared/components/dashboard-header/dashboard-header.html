<header
  class="sticky top-0 z-20 flex h-[68px] items-center justify-between gap-3 border-b border-gray-200/80 bg-white/80 px-4 backdrop-blur-xl md:px-6"
>
  <div class="flex items-center gap-3">
    <button
      class="inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-xl border border-gray-200 bg-white text-gray-500 shadow-sm hover:bg-gray-50 lg:hidden"
      type="button"
      (click)="onToggleSidebar()"
    >
      <i class="fa-solid fa-bars text-sm"></i>
    </button>
    <div class="min-w-0">
      <p class="m-0 truncate text-[11px] font-semibold uppercase tracking-[0.12em] text-blue-600">{{ subtitle() }}</p>
      <h1 class="m-0 truncate text-[19px] font-bold tracking-tight text-gray-900">{{ title() }}</h1>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <app-notification-bell />
    
    @if (showingAlerts()) {
      <button
        class="relative inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-xl border border-gray-200 bg-white text-gray-500 shadow-sm transition hover:bg-gray-50 hover:text-gray-700"
        type="button"
        [routerLink]="alertsRoute()"
      >
        <i class="fa-solid fa-triangle-exclamation text-[15px]"></i>
        @if (alertsCount() > 0) {
          <span class="absolute -top-1 -right-1 inline-flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[9px] font-bold text-white">
            {{ alertsCount() }}
          </span>
        }
      </button>
    }

    <div
      class="hidden items-center gap-2.5 rounded-full border border-gray-200 bg-white py-1 pr-1 pl-3.5 shadow-sm md:flex"
    >
      <span class="text-[13px] font-medium text-gray-700">{{ fullName() }}</span>
      @if (profileImage()) {
        <img
          [src]="profileImage()"
          alt="Avatar"
          class="h-8 w-8 rounded-full object-cover"
        />
      } @else {
        <div
          class="flex h-8 w-8 items-center justify-center rounded-full bg-linear-to-br from-blue-600 to-sky-500 text-xs font-bold text-white"
        >
          {{ initials() }}
        </div>
      }
    </div>
  </div>
</header>
